<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Grote Paasquiz 🐣</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #e0f7fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 25px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border: 5px solid #80deea; margin-top: 20px; }
        .opt { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #f1f8e9; border-radius: 15px; cursor: pointer; border: 2px solid #c5e1a5; font-size: 1.1rem; transition: 0.3s; font-weight: bold; color: #33691e; text-align: center; }
        .opt:hover { background: #dcedc8; transform: scale(1.02); border-color: #9ccc65; }
        .hidden { display: none; }
        textarea { width: 100%; border-radius: 10px; padding: 10px; margin-top: 15px; border: 2px solid #80deea; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        #send-btn { background: #00bcd4; color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1.2rem; transition: 0.2s; }
        #send-btn:hover { background: #00acc1; transform: translateY(-2px); }
        .progress { font-size: 1rem; color: #00838f; font-weight: bold; margin-bottom: 15px; background: #b2ebf2; padding: 5px 15px; border-radius: 20px; display: inline-block; }
        h2 { color: #006064; }
    </style>
</head>
<body>

    <div class="card" id="q-box">
        <div class="progress" id="q-num">Vraag 1 / 20</div>
        <p id="q-txt" style="font-size: 1.4rem; font-weight: bold; color: #006064; min-height: 3.5rem; display: flex; align-items: center; justify-content: center;"></p>
        <div id="opts"></div>
    </div>
