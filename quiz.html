<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Grote Paasquiz 🐣</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #e0f7fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 25px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border: 5px solid #80deea; margin-top: 20px; }
        .opt { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #f1f8e9; border-radius: 15px; cursor: pointer; border: 2px solid #c5e1a5; font-size: 1.1rem; transition: 0.3s; font-weight: bold; color: #33691e; text-align: center; }
        .opt:hover { background: #dcedc8; transform: scale(1.02); border-color: #9ccc65; }
        .hidden { display: none; }
        textarea { width: 100%; border-radius: 10px; padding: 10px; margin-top: 15px; border: 2px solid #80deea; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        #send-btn { background: #00bcd4; color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1.2rem; transition: 0.2s; }
        #send-btn:hover { background: #00acc1; transform: translateY(-2px); }
        .progress { font-size: 1rem; color: #00838f; font-weight: bold; margin-bottom: 15px; background: #b2ebf2; padding: 5px 15px; border-radius: 20px; display: inline-block; }
        h2 { color: #006064; }
    </style>
</head>
<body>

    <div class="card" id="q-box">
        <div class="progress" id="q-num">Vraag 1 / 20</div>
        <p id="q-txt" style="font-size: 1.4rem; font-weight: bold; color: #006064; min-height: 3.5rem; display: flex; align-items: center; justify-content: center;"></p>
        <div id="opts"></div>
    </div>

    <div class="card hidden" id="f-box">
        <h2>Je bent een Topper! 🌟</h2>
        <p>Je hebt alle 20 vragen beantwoord. Wat vond je ervan? Laat een berichtje achter voor de rest op de Paasmuur:</p>
        <textarea id="msg" rows="4" placeholder="Typ hier je paaswens of berichtje..."></textarea>
        <button id="send-btn" onclick="sendMsg()">Post op de Paasmuur 🚀</button>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://bltdlfuxiboskglkmbhd.supabase.co', 'sb_publishable_U66BtV2nkxjqnCtevNBRqw_zOrdiBDV');
        
        // Haal de naam op die in index.html is ingevuld
        const naam = localStorage.getItem('paasNaam') || 'Anoniem';
        let idx = 0;

        // De 20 vrolijke vragen
        const qs = [
            {q: "Wat verstopt de Paashaas het liefst?", a: ["Sokken", "Paaseieren", "Hondenbrokken"]},
            {q: "Welke kleur heeft een kuikentje?", a: ["Geel", "Paars", "Puntjes"]},
            {q: "Wat voor geluid maakt een kip?", a: ["Boe", "Tok Tok", "Miau"]},
            {q: "Wat zit er vaak in een chocolade ei?", a: ["Lucht", "Speelgoed", "Broccoli"]},
            {q: "Hoe loopt een paashaas?", a: ["Waggelen", "Huppelen", "Rennen"]},
            {q: "Welke kleur heeft een wortel?", a: ["Blauw", "Oranje", "Roze"]},
            {q: "Wat eten we vaak bij het luxe paasontbijt?", a: ["Pizza", "Paasstol", "Patat"]},
            {q: "Wat doe je met een eitje voor je hem opeet?", a: ["Schilderen", "Wassen", "Strijken"]},
            {q: "Hoeveel oren heeft een paashaas?", a: ["1", "2", "Veel"]},
            {q: "Waar komen eieren vandaan?", a: ["De fabriek", "De kip", "De boom"]},
            {q: "Wat is het lekkerste aan Pasen?", a: ["Chocolade", "Huiswerk", "Regen"]},
            {q: "Welke bloem hoort bij de lente?", a: ["Cactus", "Narcis", "Denneboom"]},
            {q: "Als een ei valt, dan...", a: ["Breekt het", "Vliegt het weg", "Lacht het"]},
            {q: "Wat draagt de Paashaas om zijn eieren in te doen?", a: ["Rugzak", "Mandje", "Vuilniszak"]},
            {q: "Welk dier komt uit een ei?", a: ["Hond", "Vogel", "Olifant"]},
            {q: "Wat voor weer is het hopelijk met Pasen?", a: ["Sneeuw", "Zon", "Onweer"]},
            {q: "Hoeveel eieren kun je op op een lege maag?", a: ["1", "10", "Geen"]},
            {q: "Welk snoepje lijkt op een eitje?", a: ["Drop", "M&M's", "Lolly"]},
            {q: "Wie is de snelste met eieren zoeken?", a: ["Ik!", "Oma", "De kat"]},
            {q: "Ben je klaar voor de paasbrunch?", a: ["Ja!", "Nee", "Bijna"]}
        ];

        function show() {
            if(idx >= qs.length) { 
                document.getElementById('q-box').classList.add('hidden'); 
                document.getElementById('f-box').classList.remove('hidden'); 
                return; 
            }
            
            document.getElementById('q-num').innerText = `Vraag ${idx + 1} / ${qs.length}`;
            document.getElementById('q-txt').innerText = qs[idx].q;
            
            const div = document.getElementById('opts'); 
            div.innerHTML = '';
            
            qs[idx].a.forEach(opt => {
                const b = document.createElement('button');
                b.className = 'opt'; 
                b.innerText = opt;
                b.onclick = () => next(opt);
                div.appendChild(b);
            });
        }

        async function next(ans) {
            // Belangrijk: we gebruiken .insert() zodat de Admin elk antwoord kan zien
            await supabaseClient.from('spelers').insert([{
                naam: naam, 
                vraag_nr: idx + 1, 
                laatste_antwoord: ans
            }]);

            idx++; 
            show();
        }

        async function sendMsg() {
            const m = document.getElementById('msg').value;
            if(!m) return;
            
            await supabaseClient.from('reacties').insert([{
                naam: naam, 
                bericht: m
            }]);
            
            // Stuur de speler direct naar de gezellige Paasmuur
            window.location.href = 'reacties.html';
        }

        // Start de eerste vraag
        show();
    </script>
</body>
</html>
