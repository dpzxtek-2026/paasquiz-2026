<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>LIVE MONITOR - Paasquiz 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .monitor-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; max-width: 900px; margin: auto; text-align: left; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 1.1rem; }
        th { text-align: left; color: #94a3b8; border-bottom: 2px solid #334155; padding: 15px; text-transform: uppercase; font-size: 0.8rem; }
        td { padding: 15px; border-bottom: 1px solid #334155; }
        .highlight { color: #fbbf24; font-weight: bold; font-size: 1.2rem; }
        .status-dot { height: 10px; width: 10px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="monitor-card">
        <div class="header-flex">
            <h1>🐣 Live Paas-Monitor</h1>
            <div id="live-indicator"><span class="status-dot"></span> LIVE</div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Speler</th>
                    <th>Voortgang</th>
                    <th>Laatste Antwoord</th>
                </tr>
            </thead>
            <tbody id="data-table">
                <tr><td colspan="3" style="text-align:center; padding:40px;">Wachten op eerste speler... 🐰</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Directe verbinding zonder gedoe
        const client = supabase.createClient('https://bltdlfuxiboskglkmbhd.supabase.co', 'sb_publishable_U66BtV2nkxjqnCtevNBRqw_zOrdiBDV');

        async function refreshData() {
            const { data, error } = await client
                .from('spelers')
                .select('*')
                .order('updated_at', { ascending: false });

            if (error) {
                console.error("Databasefout:", error.message);
                return;
            }

            if (data && data.length > 0) {
                const tableBody = document.getElementById('data-table');
                tableBody.innerHTML = data.map(row => `
                    <tr>
                        <td class="highlight">${row.naam}</td>
                        <td><b>${row.vraag_nr}</b> / 10</td>
                        <td style="color: #cbd5e1;">${row.laatste_antwoord || '...'}</td>
                    </tr>
                `).join('');
            }
        }

        // Start de monitor direct
        refreshData();
        // Ververs elke 2 seconden voor echte live-ervaring
        setInterval(refreshData, 2000);
    </script>
</body>
</html>
