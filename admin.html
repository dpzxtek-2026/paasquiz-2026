<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>LIVE MONITOR - Paasquiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .monitor-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #94a3b8; border-bottom: 2px solid #334155; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #334155; }
        .highlight { color: #fbbf24; font-weight: bold; }
        .error-msg { color: #ef4444; background: #451a1a; padding: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>
    <div class="monitor-card">
        <h1>🐣 Live Paasquiz Monitor 2026</h1>
        <div id="error-box" class="error-msg"></div>
        <table>
            <thead>
                <tr>
                    <th>Speler</th>
                    <th>Vraag</th>
                    <th>Antwoord</th>
                </tr>
            </thead>
            <tbody id="data-table">
                <tr><td colspan="3">Wachten op actieve spelers...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const client = supabase.createClient('https://bltdlfuxiboskglkmbhd.supabase.co', 'sb_publishable_U66BtV2nkxjqnCtevNBRqw_zOrdiBDV');

        async function refreshData() {
            const { data, error } = await client
                .from('spelers')
                .select('*')
                .order('updated_at', { ascending: false });

            if (error) {
                const box = document.getElementById('error-box');
                box.style.display = 'block';
                box.innerText = "Database Fout: " + error.message;
                return;
            }

            if (data && data.length > 0) {
                document.getElementById('data-table').innerHTML = data.map(row => `
                    <tr>
                        <td class="highlight">${row.naam}</td>
                        <td>${row.vraag_nr} / 10</td>
                        <td>${row.laatste_antwoord || 'Bezig...'}</td>
                    </tr>
                `).join('');
            }
        }

        // Start direct en ververs elke 2 seconden
        refreshData();
        setInterval(refreshData, 2000);
    </script>
</body>
</html>
