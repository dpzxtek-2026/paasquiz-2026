<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 PAAS-REGIE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Speler Kaart */
        .player-card { 
            background: #1e293b; 
            margin-bottom: 10px; 
            border-radius: 10px; 
            border: 1px solid #334155; 
            overflow: hidden;
            transition: 0.3s;
        }
        .player-header { 
            padding: 15px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: #2d3748;
        }
        .player-header:hover { background: #3d4a5d; }
        .player-name { color: #fbbf24; font-weight: bold; font-size: 1.1rem; }
        
        /* Detail Lijst (verborgen tot klik) */
        .details { display: none; padding: 15px; background: #1a202c; border-top: 1px solid #334155; }
        .detail-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #2d3748; font-size: 0.9rem; }
        
        .correct { color: #10b981; font-weight: bold; }
        .wrong { color: #ef4444; font-weight: bold; }
        
        .btn-clear { background: none; border: 1px solid #ef4444; color: #ef4444; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-clear:hover { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🐣 Live Monitor</h1>
            <button class="btn-clear" onclick="clearData()">Wis Alles 🛑</button>
        </div>

        <div id="player-list">
            <p style="text-align:center;">Wachten op spelers... 🐰</p>
        </div>
    </div>

    <script>
        const client = supabase.createClient('https://bltdlfuxiboskglkmbhd.supabase.co', 'sb_publishable_U66BtV2nkxjqnCtevNBRqw_zOrdiBDV');
        
        // De juiste antwoorden ter controle
        const answers = ["Paaseieren", "Geel", "Snoeihout", "Een kippenei", "Paasstol", "De kip", "De lente", "Schilderen", "Stille Zaterdag", "De Paashaas"];

        async function load() {
            const { data, error } = await client.from('spelers').select('*').order('updated_at', { ascending: false });
            if (error) return;

            if (data && data.length > 0) {
                const list = document.getElementById('player-list');
                list.innerHTML = data.map(p => {
                    // We gaan ervan uit dat we de voortgang bijhouden. 
                    // Voor een complete lijst van ELK antwoord zou je een aparte tabel nodig hebben, 
                    // maar we tonen hier het LAATSTE antwoord en de voortgang.
                    const isCorrect = answers.includes(p.laatste_antwoord);
                    const status = isCorrect ? '<span class="correct">❤️</span>' : '<span class="wrong">X</span>';

                    return `
                        <div class="player-card">
                            <div class="player-header" onclick="toggle('${p.naam}')">
                                <div>
                                    <span class="player-name">${p.naam}</span>
                                    <span style="margin-left:10px; opacity:0.7;">Vraag ${p.vraag_nr}/10</span>
                                </div>
                                <div>${status} ▼</div>
                            </div>
                            <div class="details" id="details-${p.naam}">
                                <div class="detail-row">
                                    <span>Laatste actie:</span>
                                    <span>${new Date(p.updated_at).toLocaleTimeString()}</span>
                                </div>
                                <div class="detail-row">
                                    <span>Gekozen antwoord:</span>
                                    <span class="${isCorrect ? 'correct' : 'wrong'}">${p.laatste_antwoord || 'Geen'}</span>
                                </div>
                                <p style="font-size:0.8rem; opacity:0.5; margin-top:10px;">Klik nogmaals om te sluiten.</p>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function toggle(id) {
            const el = document.getElementById('details-' + id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        async function clearData() {
            if(prompt("Typ 'Pasen' om te wissen:") === "Pasen") {
                await client.from('spelers').delete().neq('naam', 'dummy');
                location.reload();
            }
        }

        setInterval(load, 2000);
        load();
    </script>
</body>
</html>
