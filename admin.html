<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>👑 PAAS-REGIE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        
        /* Regie Sectie */
        .regie-box { display: flex; gap: 10px; margin-top: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; }
        
        /* Knoppen */
        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
        .btn-green { background: #10b981; }
        .btn-orange { background: #f59e0b; }
        .btn-red { background: #ef4444; }

        /* Speler Lijst */
        .player-card { background: #1e293b; margin-bottom: 8px; border-radius: 8px; border: 1px solid #334155; overflow: hidden; }
        .player-header { padding: 12px; cursor: pointer; display: flex; justify-content: space-between; background: #2d3748; }
        .details { display: none; padding: 10px; background: #111827; font-size: 0.9rem; }
        .ans-row { display: flex; justify-content: space-between; padding: 5px 10px; border-bottom: 1px solid #1f2937; }
        .correct { color: #10b981; } .wrong { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>👑 Paas-Regie 2026</h1>

        <div class="card">
            <h3>📢 Bericht naar Paasmuur (5 sec)</h3>
            <div class="regie-box">
                <input type="text" id="admin-msg" placeholder="Typ bijv: Nana gaat aan kop! 🐣">
                <button class="btn btn-green" onclick="stuurBericht()">Stuur 🚀</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="btn btn-orange" onclick="wisMuur()">Wis Paasmuur 🧹</button>
            <button class="btn btn-red" onclick="wisSpelers()">Wis Alle Spelers 🛑</button>
        </div>

        <div id="player-list">Laden...</div>
    </div>

    <script>
        const client = supabase.createClient('https://bltdlfuxiboskglkmbhd.supabase.co', 'sb_publishable_U66BtV2nkxjqnCtevNBRqw_zOrdiBDV');
        const correctAnswers = ["Paaseieren", "Geel", "Snoeihout", "Een kippenei", "Paasstol", "De kip", "De lente", "Schilderen", "Stille Zaterdag", "De Paashaas"];

        async function load() {
            const { data } = await client.from('spelers').select('*').order('vraag_nr', { ascending: true });
            if (!data) return;

            const grouped = data.reduce((acc, curr) => {
                if (!acc[curr.naam]) acc[curr.naam] = [];
                acc[curr.naam].push(curr);
                return acc;
            }, {});

            document.getElementById('player-list').innerHTML = Object.keys(grouped).map(name => {
                const pData = grouped[name];
                return `
                    <div class="player-card">
                        <div class="player-header" onclick="toggle('${name}')">
                            <span><b>${name}</b> (${pData.length}/10)</span>
                            <span>Geschiedenis ▼</span>
                        </div>
                        <div class="details" id="details-${name}">
                            ${pData.map(d => {
                                const isOk = correctAnswers.includes(d.laatste_antwoord);
                                return `<div class="ans-row">
                                    <span>Vraag ${d.vraag_nr}: ${d.laatste_antwoord}</span>
                                    <span class="${isOk ? 'correct' : 'wrong'}">${isOk ? '❤️' : 'X'}</span>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
            }).join('');
        }

        async function stuurBericht() {
            const txt = document.getElementById('admin-msg').value;
            if(!txt) return;
            await client.from('meldingen').upsert({ id: 1, tekst: txt });
            document.getElementById('admin-msg').value = '';
            setTimeout(async () => { await client.from('meldingen').upsert({ id: 1, tekst: '' }); }, 5000);
        }

        function toggle(id) {
            const el = document.getElementById('details-' + id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        async function wisSpelers() { if(prompt("Wachtwoord 'Pasen':") === "Pasen") await client.from('spelers').delete().neq('id', 0); location.reload(); }
        async function wisMuur() { if(prompt("Wachtwoord 'Pasen':") === "Pasen") await client.from('reacties').delete().neq('id', 0); alert("Muur gewist!"); }

        setInterval(load, 3000);
        load();
    </script>
</body>
</html>
