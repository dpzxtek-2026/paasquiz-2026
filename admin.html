<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>👑 PAAS-REGIE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .player-card { background: #1e293b; margin-bottom: 10px; border-radius: 10px; border: 1px solid #334155; overflow: hidden; }
        .player-header { padding: 15px; cursor: pointer; display: flex; justify-content: space-between; background: #2d3748; }
        .player-header:hover { background: #3d4a5d; }
        .player-name { color: #fbbf24; font-weight: bold; font-size: 1.1rem; }
        
        .details { display: none; padding: 10px; background: #111827; }
        .ans-row { display: flex; justify-content: space-between; padding: 8px 15px; border-bottom: 1px solid #1f2937; }
        
        .correct { color: #10b981; font-weight: bold; }
        .wrong { color: #ef4444; font-weight: bold; }
        
        .btn-clear { background: #ef4444; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🐣 Live Monitor (Klik op naam)</h1>
            <button class="btn-clear" onclick="clearData()">Wis Antwoorden 🛑</button>
        </div>

        <div id="player-list">Laden... 🐰</div>
    </div>

    <script>
        const client = supabase.createClient('https://bltdlfuxiboskglkmbhd.supabase.co', 'sb_publishable_U66BtV2nkxjqnCtevNBRqw_zOrdiBDV');
        const correctAnswers = ["Paaseieren", "Geel", "Snoeihout", "Een kippenei", "Paasstol", "De kip", "De lente", "Schilderen", "Stille Zaterdag", "De Paashaas"];

        async function load() {
            const { data, error } = await client.from('spelers').select('*').order('vraag_nr', { ascending: true });
            if (error || !data) return;

            // Groepeer alle antwoorden per speler-naam
            const grouped = data.reduce((acc, curr) => {
                if (!acc[curr.naam]) acc[curr.naam] = [];
                acc[curr.naam].push(curr);
                return acc;
            }, {});

            const listDiv = document.getElementById('player-list');
            listDiv.innerHTML = Object.keys(grouped).map(name => {
                const pData = grouped[name];
                const lastIdx = pData.length - 1;
                const lastIsCorrect = correctAnswers.includes(pData[lastIdx].laatste_antwoord);

                return `
                    <div class="player-card">
                        <div class="player-header" onclick="toggle('${name}')">
                            <span><span class="player-name">${name}</span> (${pData.length}/10)</span>
                            <span>${lastIsCorrect ? '❤️' : 'X'} ▼</span>
                        </div>
                        <div class="details" id="details-${name}">
                            ${pData.map(d => {
                                const isOk = correctAnswers.includes(d.laatste_antwoord);
                                return `
                                    <div class="ans-row">
                                        <span>Vraag ${d.vraag_nr}: ${d.laatste_antwoord}</span>
                                        <span class="${isOk ? 'correct' : 'wrong'}">${isOk ? '❤️' : 'X'}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggle(id) {
            const el = document.getElementById('details-' + id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        async function clearData() {
            if(prompt("Wachtwoord 'Pasen' om alles te wissen:") === "Pasen") {
                await client.from('spelers').delete().neq('id', 0);
                location.reload();
            }
        }

        setInterval(load, 3000);
        load();
    </script>
</body>
</html>
