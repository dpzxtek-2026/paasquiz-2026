<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>De Paasmuur 🐣</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #fff9c4; font-family: 'Comic Sans MS', cursive; padding: 20px; overflow-x: hidden; }
        h1 { text-align: center; color: #ff8f00; font-size: 3rem; text-shadow: 2px 2px white; }
        #wall { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .post-it { background: #ffeb3b; padding: 20px; width: 200px; min-height: 150px; border-radius: 5px; box-shadow: 5px 5px 15px rgba(0,0,0,0.1); transform: rotate(-2deg); animation: pop 0.5s ease-out; }
        .post-it:nth-child(even) { background: #a5d6a7; transform: rotate(3deg); }
        .naam { font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.1); margin-bottom: 10px; display: block; }
        
        /* REGIE MELDING */
        #notificatie { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ff5722; color: white; padding: 40px; border-radius: 20px; font-size: 3rem; font-weight: bold; text-align: center; z-index: 1000; border: 8px solid white; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="notificatie"></div>
    <h1>🐰 De Paasmuur 🐣</h1>
    <div id="wall">Laden...</div>

    <script>
        const client = supabase.createClient('https://bltdlfuxiboskglkmbhd.supabase.co', 'sb_publishable_U66BtV2nkxjqnCtevNBRqw_zOrdiBDV');

        async function updateWall() {
            const { data } = await client.from('reacties').select('*').order('created_at', { ascending: false });
            if (!data) return;
            document.getElementById('wall').innerHTML = data.map(r => `
                <div class="post-it">
                    <span class="naam">${r.naam}</span>
                    ${r.bericht}
                </div>
            `).join('');
        }

        async function checkRegie() {
            const { data } = await client.from('meldingen').select('tekst').eq('id', 1).single();
            const box = document.getElementById('notificatie');
            if (data && data.tekst !== '') {
                box.innerText = data.tekst;
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        setInterval(() => { updateWall(); checkRegie(); }, 2000);
        updateWall();
    </script>
</body>
</html>
